<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebCut</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">SAVED CAPTURES</p>
          <h1>WebCut</h1>
        </div>
        <span id="saved-count" class="saved-count">0 saved</span>
      </header>

      <section class="search-section" aria-label="Search saved captures">
        <label class="sr-only" for="search-input">Search saved pages</label>
        <div class="search-field">
          <input id="search-input" type="search" placeholder="Search saved pages" autocomplete="off" spellcheck="false">
          <button id="clear-search" class="icon-button" type="button" aria-label="Clear search" hidden>×</button>
        </div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite">Loading saved captures…</p>

      <section id="empty-state" class="empty-state" aria-live="polite" hidden>
        <h2>No saved captures yet</h2>
        <p>Clone a page from the toolbar to see it here.</p>
      </section>

      <section id="recent-section" class="content-section" aria-labelledby="recent-heading" hidden>
        <div class="section-heading">
          <h2 id="recent-heading">Recent</h2>
        </div>
        <div id="recent-list" class="recent-list"></div>
        <button id="recent-toggle" class="text-button" type="button">Show all recent</button>
      </section>

      <section id="folders-area" class="folders-area" aria-labelledby="folders-heading" hidden>
        <div class="section-heading">
          <h2 id="folders-heading">Folders</h2>
          <button id="new-folder-button" class="text-button" type="button">+ New folder</button>
        </div>
        <form id="new-folder-form" class="folder-form" hidden>
          <label class="sr-only" for="new-folder-input">Folder name</label>
          <input id="new-folder-input" type="text" maxlength="40" placeholder="Folder name" autocomplete="off">
          <div class="folder-form-actions">
            <button id="create-folder" class="action-button action-button-primary" type="submit">Create</button>
            <button id="cancel-new-folder" class="action-button" type="button">Cancel</button>
          </div>
          <p id="new-folder-error" class="field-error" role="alert" hidden></p>
        </form>
        <div id="folder-list" class="folder-grid"></div>
      </section>

      <section id="results-section" class="content-section" aria-labelledby="results-heading" hidden>
        <div class="section-heading">
          <h2 id="results-heading">Search results</h2>
        </div>
        <div id="results-list" class="item-list"></div>
      </section>

      <section id="preview-view" class="preview-view" hidden aria-labelledby="preview-heading">
        <div class="preview-header">
          <button id="preview-back" class="text-button" type="button">← Back</button>
          <h2 id="preview-heading">Preview</h2>
        </div>
        <p id="preview-status" class="status">Loading preview…</p>
        <div id="preview-frame-wrap" class="preview-frame-wrap"></div>
      </section>

      <section id="folder-view" class="folder-view" hidden aria-labelledby="folder-view-heading">
        <div class="folder-view-header">
          <button id="folder-back" class="text-button" type="button">← Back</button>
          <h2 id="folder-view-heading">Folder</h2>
        </div>
        <div class="folder-view-actions">
          <button id="add-to-folder" class="button-primary" type="button">+ Add</button>
        </div>
        <div id="folder-picker" class="folder-picker" hidden>
          <div class="section-heading">
            <h3 id="folder-picker-heading">Add to folder</h3>
            <button id="folder-picker-done" class="text-button" type="button">Done</button>
          </div>
          <p id="folder-picker-status" class="status" role="status" aria-live="polite"></p>
          <div id="folder-picker-list" class="item-list"></div>
        </div>
        <p id="folder-status" class="status" role="status" aria-live="polite"></p>
        <div id="folder-empty" class="empty-state" hidden>
          <h3>This folder is empty</h3>
          <p>Use + Add to place a saved capture here.</p>
        </div>
        <div id="folder-items" class="item-list"></div>
      </section>
    </main>
    <script src="shared/messages.js"></script>
    <script src="shared/sidepanel-logic.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
